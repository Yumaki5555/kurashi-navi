<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 困りごと、次どうする？ のアイコン原本：アンバーの角丸正方形に、白抜きの「チェックリスト（2項目）＋右向き矢印」。
       状況を確認する → 次の行動へ進む。16pxでも潰れないよう線は太く（8）、横線は画素の境目にそろえている。
       PNG は python tools/make-icons.py で書き出す -->
